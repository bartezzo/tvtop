name: Firebase App Distribution
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  distribute:
    runs-on: ubuntu-latest
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :composeApp:assembleDebug
      - name: Upload to Firebase App Distribution
        if: ${{ env.FIREBASE_APP_ID != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1.7.1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: composeApp/build/outputs/apk/debug/composeApp-debug.apk
          releaseNotes: ${{ github.event.head_commit.message }}
      - name: Skipped (no Firebase secrets)
        if: ${{ env.FIREBASE_APP_ID == '' }}
        run: echo "FIREBASE_APP_ID secret is not set; skipping upload."
