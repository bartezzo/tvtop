[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tvtop"
version = "0.1.0"
description = "tvtop project"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
tvtop = "tvtop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
